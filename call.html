<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Звонок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
    }
    .info {
      padding: 24px;
      max-width: 320px;
    }
    .phone {
      font-weight: 600;
      margin-top: 8px;
      font-size: 18px;
    }
    .hint {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="info">
    <div>Открываем звонилку…</div>
    <div class="phone" id="phoneText"></div>
    <div class="hint">
      Если окно звонка не появилось — нажми номер ещё раз в браузере.
    </div>
  </div>

  <script>
    function getPhoneFromQuery() {
      const params = new URLSearchParams(window.location.search);
      let phone = params.get("phone") || "";
      phone = phone.replace(/[^\d+]/g, "");
      return phone;
    }

    (function () {
      const phone = getPhoneFromQuery();
      const phoneTextEl = document.getElementById("phoneText");

      if (!phone) {
        phoneTextEl.textContent = "Номер не указан";
        return;
      }

      phoneTextEl.textContent = phone;

      const telUrl = "tel:" + phone;

      function tryOpenTel() {
        try {
          window.location.href = telUrl;
        } catch (e) {
          try {
            const a = document.createElement("a");
            a.href = telUrl;
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } catch (e2) {
            console.warn("Не удалось открыть tel:", e2);
          }
        }
      }

      // Даём странице загрузиться и дергаем звонилку
      setTimeout(tryOpenTel, 100);
    })();
  </script>
</body>
</html>
